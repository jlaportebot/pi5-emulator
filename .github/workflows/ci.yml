name: lobstervm CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Windows and macOS runners have no qemu-img or e2fsprogs; the tests
      # that need them skip, the rest use stand-in images.
      - name: Install qemu-img and e2fsprogs (qcow2 overlays, disk tools)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-utils e2fsprogs

      # The harness helpers analyse screenshots with Pillow (same version as
      # the dev host).
      - name: Install Pillow
        run: pip install pillow==12.2.0

      - name: Build the base disk image from base-root/
        if: runner.os == 'Linux'
        run: python tools/mkbase.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify gui_test_vm.py syntax
        run: python -c "import ast,sys; ast.parse(open('tools/gui_test_vm.py').read())"

      - name: Verify gui_test_vm.py --help
        run: python tools/gui_test_vm.py --help

      - name: Verify lobstervm --help
        run: python -m lobstervm --help

      - name: Verify lobstervm gui --help
        run: python -m lobstervm gui --help

      - name: Verify GUI module imports
        run: python -c "import lobstervm.gui; print('gui import ok')"
        env:
          DISPLAY: ""

  bundle:
    name: PyInstaller build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install -r packaging/requirements.txt

      - name: Build the onedir
        run: pyinstaller --noconfirm packaging/lobstervm.spec

      - name: Run the frozen CLI
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            "dist/LobsterVM.app/Contents/MacOS/lobstervm-cli" --help
          else
            "dist/LobsterVM/lobstervm-cli" --help
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.15

      - name: Run ruff
        run: ruff check lobstervm/ tools/ tests/ packaging/
