name: lobstervm CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit Tests (no QEMU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install qemu-img and e2fsprogs (qcow2 overlays, disk tools)
        run: sudo apt-get update && sudo apt-get install -y qemu-utils e2fsprogs

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify gui_test_vm.py syntax
        run: python3 -c "import ast,sys; ast.parse(open('tools/gui_test_vm.py').read())"

      - name: Verify gui_test_vm.py --help
        run: python3 tools/gui_test_vm.py --help

      - name: Verify lobstervm --help
        run: python3 -m lobstervm --help

      - name: Verify lobstervm gui --help
        run: python3 -m lobstervm gui --help

      - name: Verify GUI module imports
        run: python3 -c "import lobstervm.gui; print('gui import ok')"
        env:
          DISPLAY: ""

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.15

      - name: Run ruff
        run: ruff check lobstervm/ tools/ tests/
